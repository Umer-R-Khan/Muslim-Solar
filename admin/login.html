<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Al-Muslim Solar &amp; Electric Solutions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="../images/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="auth-shell">
  <div class="auth-card">
    <img src="../images/logo.svg" alt="Al Muslim" class="brand-logo" width="188" height="74">
    <h1>Admin Portal</h1>
    <p>Sign in with the Google account authorized for Al-Muslim Solar &amp; Electric Solutions.</p>

    <button id="google-signin" class="google-btn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.7 0-14.3 4.4-17.7 10.8z"/><path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.9 14-5.1l-6.5-5.4c-2 1.5-4.6 2.5-7.5 2.5-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.6 39.9 16.2 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2-2 3.7-3.7 5l6.5 5.4C41.9 35.4 44.5 30.1 44.5 24c0-1.2-.1-2.4-.9-3.5z"/></svg>
      Sign in with Google
    </button>

    <div class="auth-error" id="auth-error"></div>
    <p class="auth-note">Access is restricted to authorized team members only.</p>
  </div>
</div>
<a href="../index.html" class="back-link" style="position:fixed; bottom:20px; left:24px;">← Back to website</a>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/admin-auth.js"></script>
<script>
  const btn = document.getElementById("google-signin");
  const errorBox = document.getElementById("auth-error");

  function showError(text) {
    errorBox.textContent = text;
    errorBox.classList.add("show");
  }

  // If already signed in and authorized, skip straight to the dashboard.
  auth.onAuthStateChanged((user) => {
    if (!user) return;
    verifyAdminInFirestore(user).then((ok) => {
      if (ok) window.location.href = "dashboard.html";
    });
  });

  const btnOriginalHTML = btn.innerHTML;

  btn.addEventListener("click", () => {
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Signing in…";

    const provider = new firebase.auth.GoogleAuthProvider();
    auth
      .signInWithPopup(provider)
      .then((result) => verifyAdminInFirestore(result.user).then((ok) => ({ ok, user: result.user })))
      .then(({ ok, user }) => {
        if (ok) {
          window.location.href = "dashboard.html";
        } else {
          signOutAdmin();
          showError(
            `The account ${user.email} is not authorized for the admin portal. Ask an existing admin to add your email in Firebase, or sign in with a different account.`
          );
        }
      })
      .catch((err) => {
        console.error(err);
        if (err.code !== "auth/popup-closed-by-user") {
          showError("Sign-in failed. Please try again.");
        }
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = btnOriginalHTML;
      });
  });
</script>
</body>
</html>
